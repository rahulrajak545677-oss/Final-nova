name: Build NOVA APK from zip
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the project
        run: |
          Z=$(ls -t *.zip 2>/dev/null | head -n 1)
          [ -n "$Z" ] || { echo "No .zip found in the repo root"; exit 1; }
          echo "Using $Z"
          mkdir -p /tmp/src && unzip -q "$Z" -d /tmp/src
          P=$(dirname "$(find /tmp/src -name package.json -not -path '*/node_modules/*' | head -n 1)")
          echo "Project folder: $P"
          mkdir -p "$RUNNER_TEMP/proj" && cp -r "$P"/. "$RUNNER_TEMP/proj"/
          echo "PROJ=$RUNNER_TEMP/proj" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
        working-directory: ${{ env.PROJ }}
      - run: node setup.js
        working-directory: ${{ env.PROJ }}
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
        working-directory: ${{ env.PROJ }}
      - uses: actions/upload-artifact@v4
        with:
          name: nova-ai-debug-apk
          path: ${{ env.PROJ }}/android/app/build/outputs/apk/debug/app-debug.apk
