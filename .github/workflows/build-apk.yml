name: Build NOVA APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: unzip -q nova-ai-android_accounts.zip
      - run: cd nova-ai-android && npm install && node setup.js
      - run: cd nova-ai-android/android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nova-ai-debug-apk
          path: nova-ai-android/android/app/build/outputs/apk/debug/app-debug.apk
